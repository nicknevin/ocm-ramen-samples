---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: test-pvc
  namespace: test
  labels:
    appname: busybox
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 4Gi
  storageClassName: powerstore-sc-group
  volumeMode: Filesystem
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: test-pvc-2
  namespace: test
  labels:
    appname: busybox
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 43Gi
  storageClassName: powerstore-sc-group
  volumeMode: Filesystem
