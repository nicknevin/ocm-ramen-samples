apiVersion: v1
kind: Pod
metadata:
  labels:
    app: busybox
  name: busybox
  namespace: test
spec:
  containers:
    - command:
        - sh
        - -c
        - |
          emit() {
              echo "$(date -uIs) $NODE_NAME $POD_UID $1" | tee -a /data/replication.txt
              sync
          }
          trap "emit STOP; exit" TERM
          emit START
          while true; do
              sleep 5 & wait
              emit UPDATE
          done
      env:
        - name: POD_UID
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.uid
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: spec.nodeName
      image: quay.io/nnevin/busybox:stable
      imagePullPolicy: IfNotPresent
      name: writer
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      volumeMounts:
        - mountPath: /data
          name: data
  securityContext:
    runAsUser: 1000
    fsGroup: 1000
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: test-pvc
